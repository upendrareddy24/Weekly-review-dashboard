<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockStrategy AI | Institutional Grade Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="mesh-bg"></div>

    <div class="container">
        <aside>
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <span class="logo-text">STOCKSTRAT AI</span>
            </div>

            <div class="nav-section">
                <h3>Active Strategies</h3>
                <div id="strategyList">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <div class="nav-section">
                <h3>Insights</h3>
                <div class="strat-item" onclick="showAllTickers()">
                    <span><i class="fas fa-database" style="margin-right: 10px;"></i> All Tickers</span>
                </div>
                <div class="strat-item">
                    <span><i class="fas fa-history" style="margin-right: 10px;"></i> Recent Scans</span>
                </div>
            </div>

            <div style="margin-top: auto;">
                <div class="strat-item" style="border: 1px dashed var(--glass-border);">
                    <span><i class="fas fa-plus-circle" style="margin-right: 10px;"></i> Add Strategy</span>
                </div>
            </div>
        </aside>

        <main>
            <header>
                <div>
                    <h2 class="hero-title" id="currentStratName">Global <span class="accent-text">Intelligence</span>
                    </h2>
                    <p id="stratSubtext" style="color: var(--text-secondary);">Real-time ticker tracking across your
                        institutional strategies.</p>
                </div>
                <div id="lastUpdated" style="font-size: 0.8rem; color: var(--text-secondary);">
                    Prices synced via Yahoo Finance
                </div>
            </header>

            <div id="stockGrid" class="stock-grid">
                <!-- Setups loaded here -->
                <div style="text-align: center; padding: 5rem; opacity: 0.5;">
                    <i class="fas fa-circle-notch fa-spin"
                        style="font-size: 2rem; color: var(--accent-primary); margin-bottom: 1rem;"></i>
                    <p>Initializing Strat Radar...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        let allStrategies = [];
        let currentSetups = [];
        let currentPrices = {};

        async function init() {
            try {
                const res = await axios.get('/api/strategies');
                allStrategies = res.data;
                renderStrategies();
                if (allStrategies.length > 0) {
                    loadStrategy(allStrategies[0].id, allStrategies[0].name);
                }
            } catch (err) {
                console.error("Initialization failed:", err);
            }
        }

        function renderStrategies() {
            const list = document.getElementById('strategyList');
            list.innerHTML = allStrategies.map(s => `
                <div class="strat-item" id="strat-${s.id}" onclick="loadStrategy(${s.id}, '${s.name}')">
                    <span>${s.name}</span>
                    <i class="fas fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i>
                </div>
            `).join('');
        }

        async function loadStrategy(id, name) {
            document.querySelectorAll('.strat-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`strat-${id}`)?.classList.add('active');

            document.getElementById('currentStratName').innerHTML = `${name.split(' ')[0]} <span class="accent-text">${name.split(' ').slice(1).join(' ')}</span>`;

            try {
                const res = await axios.get(`/api/setups?strategy_id=${id}`);
                currentSetups = res.data;
                renderSetups();
                syncPrices();
            } catch (err) {
                console.error("Failed to load setups:", err);
            }
        }

        async function syncPrices() {
            const symbols = [...new Set(currentSetups.map(s => s.symbol))];
            if (symbols.length === 0) return;

            try {
                const res = await axios.post('/api/prices', { symbols });
                currentPrices = res.data;
                updatePricesInUI();
            } catch (err) {
                console.error("Price sync failed:", err);
            }
        }

        function updatePricesInUI() {
            Object.entries(currentPrices).forEach(([symbol, price]) => {
                const elements = document.querySelectorAll(`.price-${symbol}`);
                elements.forEach(el => {
                    el.innerText = price !== "N/A" ? `$${price}` : "N/A";
                });
            });
        }

        function renderSetups() {
            const grid = document.getElementById('stockGrid');
            if (currentSetups.length === 0) {
                grid.innerHTML = '<div style="text-align:center; padding: 5rem;"><p>No setups found for this strategy.</p></div>';
                return;
            }

            grid.innerHTML = currentSetups.map((s, idx) => {
                const statusClass = `status-${s.status.toLowerCase()}`;
                const ratingStars = '★'.repeat(Math.round(parseFloat(s.rating) || 0)) + '☆'.repeat(5 - Math.round(parseFloat(s.rating) || 0));

                return `
                    <div class="stock-card animate-fade" style="animation-delay: ${idx * 0.05}s">
                        <div class="card-header">
                            <div class="symbol-group">
                                <span class="symbol">${s.symbol}</span>
                                <span class="sector">${s.sector || "General"}</span>
                            </div>
                            <div class="price-group">
                                <div class="price price-${s.symbol}">Loading...</div>
                                <span class="status-badge ${statusClass}">${s.status}</span>
                            </div>
                        </div>

                        <div class="metrics">
                            <div class="metric-item">
                                <span class="metric-label">Entry</span>
                                <span class="metric-value">${s.entry || '-'}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Target</span>
                                <span class="metric-value" style="color: var(--success)">${s.target || '-'}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Rating</span>
                                <div class="rating">${ratingStars}</div>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Setup Date</span>
                                <span class="metric-value">${s.date.split(' ')[0]}</span>
                            </div>
                        </div>

                        <div class="comments">
                            <div style="font-weight: 700; font-size: 0.7rem; text-transform: uppercase; color: var(--accent-primary); margin-bottom: 0.5rem;">
                                Strategy Notes
                            </div>
                            ${s.comments || "No comments captured for this setup."}
                        </div>

                        <div style="margin-top: 1rem; display: flex; gap: 1rem;">
                            <button class="btn-secondary" style="font-size: 0.75rem; padding: 0.5rem 1rem;" onclick="viewHistory('${s.symbol}')">
                                <i class="fas fa-history"></i> Timeline
                            </button>
                            <button class="btn-secondary" style="font-size: 0.75rem; padding: 0.5rem 1rem;">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function viewHistory(symbol) {
            try {
                const res = await axios.get(`/api/ticker/${symbol}/history`);
                const history = res.data;
                // Simple alert for now, could be a modal
                alert(`History for ${symbol}:\n\n` + history.map(h => `${h.date}: ${h.status} (${h.strategy_name})`).join('\n'));
            } catch (err) {
                console.error("History fetch failed:", err);
            }
        }

        init();
    </script>
</body>

</html>
